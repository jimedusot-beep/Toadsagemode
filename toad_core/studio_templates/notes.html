<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body data-theme="{{THEME}}">
  <a class="skip" href="#notes-list">Skip to saved notes</a>
  <div class="shell">
    <header class="masthead">
      <div class="logo" aria-hidden="true">🐸</div>
      <div><p class="eyebrow">TOAD SAGE / APP STUDIO</p><h1>{{TITLE}}</h1><p class="subtitle">Capture an idea. Find it later.</p></div>
    </header>
    <main>
      <section class="panel" aria-labelledby="editor-title">
        <h2 id="editor-title">Write a note</h2>
        <form id="note-form">
          <label for="note-title">Note title</label>
          <input id="note-title" type="text" maxlength="100" autocomplete="off" placeholder="e.g. Project ideas" required>
          <label for="note-body">Note content</label>
          <textarea id="note-body" maxlength="3000" rows="5" placeholder="Write here..." required></textarea>
          <div class="form-row note-buttons">
            <button id="save-note" class="primary" type="submit">Save note</button>
            <button id="cancel-edit" type="button" hidden>Cancel edit</button>
          </div>
        </form>
        <p id="message" role="status" aria-live="polite">Notes stay in this browser when storage is available.</p>
      </section>
      <section class="panel" aria-labelledby="list-title">
        <div class="section-header"><h2 id="list-title">Your notes</h2><span id="count" class="count">0 notes</span></div>
        <label for="note-search">Search notes</label>
        <input id="note-search" type="search" autocomplete="off" placeholder="Search titles or contents">
        <ul id="notes-list" aria-label="Saved notes"></ul>
        <p id="empty" class="empty">No notes yet. Write one above.</p>
      </section>
    </main>
    <footer>Offline-first · No login · No tracking · Reviewed Toad Sage template</footer>
  </div>
</body>
</html>

name: Validate Toad Sage foundations
on:
  push:
    paths:
      - 'toad_core/**'
      - 'tools/**'
      - 'empathy/**'
      - 'tests/**'
      - 'web/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'toad_core/**'
      - 'tools/**'
      - 'empathy/**'
      - 'tests/**'
      - 'web/**'
      - '.github/workflows/validate.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: node --check web/ability-library.js
      - name: Compile Python
        run: python -m compileall -q toad_core tools tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
